name: test

on:
  pull_request:

jobs:
  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show build info
        run: |
          echo "=== Build Info ==="
          echo "Ref:      ${{ github.ref }}"
          echo "SHA:      ${{ github.sha }}"
          echo "PR:       #${{ github.event.pull_request.number }}"
          echo "Actor:    ${{ github.actor }}"
          KUBE_VERSION=$(sed -n 's/.*KUBE_VERSION="v\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' Dockerfile)
          echo "Kube:     v${KUBE_VERSION}"
          echo "Platform: linux/amd64,linux/arm64"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-platform (verify both arches)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: debug
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: debug
          load: true
          tags: vorp-debug:test

      - name: Smoke test
        run: |
          docker run --rm vorp-debug:test sh -c '
            set -e
            echo "=== Checking tools ==="
            for tool in dig curl tcpdump crictl kubectl jq yq strace ip htop ss ncat openssl socat ethtool ipvsadm iostat vim tmux screen less file tree watch; do
              printf "  %-12s" "$tool"
              path=$(which "$tool" 2>/dev/null) && echo "OK  ($path)" || { echo "MISSING"; exit 1; }
            done
            echo ""
            echo "=== Versions ==="
            crictl --version
            kubectl version --client
            echo ""
            echo "=== Image info ==="
            cat /etc/os-release | head -3
            uname -m
            echo "=== All checks passed ==="
          '

      - name: Build shell multi-platform (verify both arches)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: shell
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build shell for smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: shell
          load: true
          tags: vorp-shell:test

      # Runs as the image's own user: the shell image must work without root.
      - name: Smoke test shell
        run: |
          docker run --rm vorp-shell:test sh -c '
            set -e
            echo "=== Checking user ==="
            [ "$(id -u)" = 65532 ] || { echo "runs as uid $(id -u), expected 65532"; exit 1; }
            id
            echo "=== Checking tools ==="
            for tool in dig curl wget ping traceroute ip ss ncat telnet openssl socat kubectl jq yq vim tmux less ps; do
              printf "  %-12s" "$tool"
              path=$(which "$tool" 2>/dev/null) && echo "OK  ($path)" || { echo "MISSING"; exit 1; }
            done
            for tool in tcpdump crictl strace bpftool iptables; do
              printf "  %-12s" "$tool"
              which "$tool" >/dev/null 2>&1 && { echo "UNEXPECTED (debug-only tool)"; exit 1; } || echo "absent"
            done
            echo "=== Checking writable HOME ($HOME) ==="
            mkdir -p "$HOME/.kube/cache" && rm -rf "$HOME/.kube"
            echo ""
            echo "=== Versions ==="
            kubectl version --client
            echo ""
            echo "=== Image info ==="
            cat /etc/os-release | head -3
            uname -m
            echo "=== All checks passed ==="
          '
